<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MixMaster Resine - Calcolatore Cantiere</title>
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        darkCard: '#131b2e',
                        darkBorder: '#1e293b'
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen pb-24" x-data="resinApp()">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 bg-darkCard/90 backdrop-blur-md border-b border-darkBorder px-4 py-3 shadow-lg">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-amber-500 text-slate-900 p-2 rounded-xl font-black text-xl shadow-md">
                    <i class="fa-solid fa-flask-vial"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg leading-tight tracking-wide text-white">MixMaster <span class="text-amber-500">Resine</span></h1>
                    <p class="text-xs text-slate-400">Calcolatore & Cantiere Pro</p>
                </div>
            </div>
            <!-- Pulsanti Utility Header -->
            <div class="flex items-center space-x-2">
                <button @click="toggleWakeLock" :class="wakeLockActive ? 'bg-amber-500 text-slate-900' : 'bg-darkBorder text-slate-400'" class="p-2 rounded-xl text-sm transition shadow" title="Tieni schermo acceso">
                    <i class="fa-solid fa-lightbulb"></i>
                </button>
                <button @click="activeTab = 'recipes'" class="bg-darkBorder text-slate-200 px-3 py-2 rounded-xl text-xs font-semibold flex items-center space-x-1 border border-slate-700">
                    <i class="fa-solid fa-book-bookmark text-amber-500"></i>
                    <span>Ricette</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-md mx-auto p-4 space-y-5">

        <!-- TAB NAV -->
        <div class="flex bg-darkCard p-1 rounded-2xl border border-darkBorder">
            <button @click="activeTab = 'calculator'" :class="activeTab === 'calculator' ? 'bg-amber-500 text-slate-900 font-bold shadow' : 'text-slate-400 hover:text-white'" class="flex-1 py-2 text-xs rounded-xl transition flex items-center justify-center space-x-1">
                <i class="fa-solid fa-calculator"></i>
                <span>Calcolatore</span>
            </button>
            <button @click="activeTab = 'timer'" :class="activeTab === 'timer' ? 'bg-amber-500 text-slate-900 font-bold shadow' : 'text-slate-400 hover:text-white'" class="flex-1 py-2 text-xs rounded-xl transition flex items-center justify-center space-x-1">
                <i class="fa-solid fa-stopwatch"></i>
                <span>Timer Pot Life</span>
            </button>
        </div>

        <!-- SEZIONE 1: CALCOLATORE -->
        <div x-show="activeTab === 'calculator'" class="space-y-4">
            
            <!-- CARD INPUT DATI -->
            <div class="bg-darkCard p-4 rounded-3xl border border-darkBorder shadow-xl space-y-4">
                <div class="flex justify-between items-center border-b border-darkBorder pb-2">
                    <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider flex items-center space-x-2">
                        <i class="fa-solid fa-sliders text-amber-500"></i>
                        <span>Parametri Impasto</span>
                    </h2>
                    <span class="text-xs bg-slate-800 text-amber-400 px-2.5 py-1 rounded-lg border border-amber-500/20 font-semibold" x-text="calcMode === 'weight' ? 'Rapporto Peso (A:B)' : 'Rapporto Volume'"></span>
                </div>

                <!-- Selettore Modalità Calcolo (Superficie vs Totale Manuale) -->
                <div class="grid grid-cols-2 gap-2 bg-slate-900/60 p-1.5 rounded-2xl border border-darkBorder">
                    <button @click="inputMode = 'surface'" :class="inputMode === 'surface' ? 'bg-slate-800 text-amber-400 font-bold border border-amber-500/30' : 'text-slate-400'" class="py-2 text-xs rounded-xl transition">Da Metri Quadri</button>
                    <button @click="inputMode = 'manual'" :class="inputMode === 'manual' ? 'bg-slate-800 text-amber-400 font-bold border border-amber-500/30' : 'text-slate-400'" class="py-2 text-xs rounded-xl transition">Totale Manuale (g/kg)</button>
                </div>

                <!-- Modalità Superficie -->
                <div x-show="inputMode === 'surface'" class="space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs text-slate-400 block mb-1 font-medium">Superficie ($m^2$)</label>
                            <input type="number" step="0.1" x-model.number="sqm" class="w-full bg-slate-900 border border-darkBorder rounded-xl p-3 text-white font-bold focus:outline-none focus:border-amber-500">
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 block mb-1 font-medium">Spessore / Consumo ($kg/m^2$)</label>
                            <input type="number" step="0.05" x-model.number="consumption" class="w-full bg-slate-900 border border-darkBorder rounded-xl p-3 text-white font-bold focus:outline-none focus:border-amber-500">
                        </div>
                    </div>
                    <div class="bg-amber-500/10 border border-amber-500/20 p-3 rounded-xl flex justify-between items-center text-xs">
                        <span class="text-slate-300">Totale Materiale Stimato:</span>
                        <span class="font-bold text-amber-400 text-sm" x-text="totalNeededKg.toFixed(2) + ' kg'"></span>
                    </div>
                </div>

                <!-- Input Base Comp A & B -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1 font-medium">Base Comp. A</label>
                        <input type="number" step="any" x-model.number="compA" class="w-full bg-slate-900 border border-darkBorder rounded-xl p-3 text-white font-bold focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1 font-medium">Rapporto Comp. B</label>
                        <div class="flex space-x-1">
                            <input type="number" step="any" x-model.number="ratioB" class="w-full bg-slate-900 border border-darkBorder rounded-xl p-3 text-white font-bold focus:outline-none focus:border-amber-500">
                        </div>
                    </div>
                </div>

                <!-- 3° Componente (Opzionale: es. Quarzo / Carica) -->
                <div class="pt-2 border-t border-darkBorder">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs text-slate-300 font-semibold flex items-center space-x-1">
                            <i class="fa-solid fa-mountain text-amber-500"></i>
                            <span>3° Componente / Carica (Opz.)</span>
                        </label>
                        <input type="checkbox" x-model="useCompC" class="accent-amber-500 w-4 h-4 rounded">
                    </div>
                    <div x-show="useCompC" class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs text-slate-400 block mb-1">Nome Carica</label>
                            <input type="text" x-model="nameCompC" placeholder="es. Quarzo 0.3" class="w-full bg-slate-900 border border-darkBorder rounded-xl p-2.5 text-xs text-white">
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 block mb-1">% su A+B o Valore</label>
                            <input type="number" step="any" x-model.number="valCompC" class="w-full bg-slate-900 border border-darkBorder rounded-xl p-2.5 text-xs text-white font-bold">
                        </div>
                    </div>
                </div>

                <!-- Elemento di Diluizione (Acqua / Diluente) -->
                <div class="pt-2 border-t border-darkBorder">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs text-slate-300 font-semibold flex items-center space-x-1">
                            <i class="fa-solid fa-droplet text-blue-400"></i>
                            <span>Diluizione (Acqua / Diluente)</span>
                        </label>
                        <input type="checkbox" x-model="useDilution" class="accent-blue-500 w-4 h-4 rounded">
                    </div>
                    <div x-show="useDilution" class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs text-slate-400 block mb-1">Tipo Diluente</label>
                            <input type="text" x-model="nameDilution" placeholder="es. Acqua / Diluente PU" class="w-full bg-slate-900 border border-darkBorder rounded-xl p-2.5 text-xs text-white">
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 block mb-1">% Massima</label>
                            <input type="number" step="1" x-model.number="percentDilution" class="w-full bg-slate-900 border border-darkBorder rounded-xl p-2.5 text-xs text-white font-bold" placeholder="% es 10">
                        </div>
                    </div>
                </div>
            </div>

            <!-- CARD RISULTATI ESATTI -->
            <div class="bg-gradient-to-br from-darkCard to-slate-900 p-5 rounded-3xl border border-amber-500/30 shadow-2xl space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-xs font-extrabold uppercase tracking-widest text-amber-400 flex items-center space-x-2">
                        <i class="fa-solid fa-square-poll-vertical"></i>
                        <span>Dosaggio Consigliato</span>
                    </h2>
                    <button @click="copyRecipe" class="bg-amber-500/20 text-amber-400 hover:bg-amber-500 hover:text-slate-900 px-3 py-1 rounded-lg text-xs font-bold transition flex items-center space-x-1 border border-amber-500/30">
                        <i class="fa-solid fa-copy"></i>
                        <span>Copia</span>
                    </button>
                </div>

                <div class="space-y-3">
                    <!-- Comp A -->
                    <div class="bg-slate-900/80 p-3.5 rounded-2xl border border-darkBorder flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <div class="w-3 h-3 rounded-full bg-blue-500"></div>
                            <div>
                                <p class="text-xs text-slate-400 font-medium">Componente A</p>
                                <p class="text-lg font-black text-white" x-text="resultA.toFixed(1) + ' g'"></p>
                            </div>
                        </div>
                        <span class="text-xs text-slate-500 font-mono" x-text="(resultA/1000).toFixed(3) + ' kg'"></span>
                    </div>

                    <!-- Comp B -->
                    <div class="bg-slate-900/80 p-3.5 rounded-2xl border border-darkBorder flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <div class="w-3 h-3 rounded-full bg-amber-500"></div>
                            <div>
                                <p class="text-xs text-slate-400 font-medium">Componente B (Indurente)</p>
                                <p class="text-lg font-black text-amber-400" x-text="resultB.toFixed(1) + ' g'"></p>
                            </div>
                        </div>
                        <span class="text-xs text-slate-500 font-mono" x-text="(resultB/1000).toFixed(3) + ' kg'"></span>
                    </div>

                    <!-- Comp C (Se attivo) -->
                    <div x-show="useCompC" class="bg-slate-900/80 p-3.5 rounded-2xl border border-darkBorder flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                            <div>
                                <p class="text-xs text-slate-400 font-medium" x-text="nameCompC || 'Carica / Quarzo'"></p>
                                <p class="text-lg font-black text-emerald-400" x-text="resultC.toFixed(1) + ' g'"></p>
                            </div>
                        </div>
                        <span class="text-xs text-slate-500 font-mono" x-text="(resultC/1000).toFixed(3) + ' kg'"></span>
                    </div>

                    <!-- Diluizione (Se attivo) -->
                    <div x-show="useDilution" class="bg-slate-900/80 p-3.5 rounded-2xl border border-darkBorder flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <div class="w-3 h-3 rounded-full bg-cyan-400"></div>
                            <div>
                                <p class="text-xs text-slate-400 font-medium" x-text="nameDilution || 'Diluente'"></p>
                                <p class="text-lg font-black text-cyan-300" x-text="resultDilution.toFixed(1) + ' g'"></p>
                            </div>
                        </div>
                        <span class="text-xs text-slate-500 font-mono" x-text="'Max ' + percentDilution + '%'"></span>
                    </div>
                </div>

                <!-- Totale Impasto -->
                <div class="pt-3 border-t border-darkBorder flex justify-between items-center text-sm font-bold">
                    <span class="text-slate-300">Peso Totale Miscela:</span>
                    <span class="text-white text-base" x-text="totalBatchWeight.toFixed(1) + ' g (' + (totalBatchWeight/1000).toFixed(2) + ' kg)'"></span>
                </div>

                <!-- Pulsante Salva Ricetta -->
                <button @click="saveCurrentRecipe" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3.5 rounded-2xl shadow-lg transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Salva nei Preferiti</span>
                </button>
            </div>
        </div>

        <!-- SEZIONE 2: TIMER POT LIFE -->
        <div x-show="activeTab === 'timer'" class="space-y-4">
            <div class="bg-darkCard p-6 rounded-3xl border border-darkBorder shadow-xl text-center space-y-6">
                <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-stopwatch text-amber-500"></i>
                    <span>Controllo Pot Life (Reattività)</span>
                </h2>

                <!-- Input Durata Timer (Minuti) -->
                <div class="flex justify-center items-center space-x-3">
                    <span class="text-xs text-slate-400">Durata Standard:</span>
                    <input type="number" x-model.number="timerMinutesSetting" class="w-20 bg-slate-900 border border-darkBorder rounded-xl p-2 text-center text-white font-bold">
                    <span class="text-xs text-slate-400">min</span>
                </div>

                <!-- Display Cerchio Timer -->
                <div class="relative w-48 h-48 mx-auto flex items-center justify-center rounded-full border-8 transition-colors duration-500 shadow-inner"
                     :class="timerStatusColor">
                    <div class="text-center">
                        <span class="text-3xl font-black font-mono" x-text="formatTime(timeLeft)"></span>
                        <p class="text-xs uppercase tracking-widest mt-1 font-semibold opacity-80" x-text="timerStateText"></p>
                    </div>
                </div>

                <!-- Controlli Timer -->
                <div class="grid grid-cols-3 gap-2 pt-2">
                    <button @click="startTimer" x-show="!timerRunning" class="col-span-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl shadow transition">Avvia Timer</button>
                    <button @click="pauseTimer" x-show="timerRunning" class="col-span-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl shadow transition">Pausa</button>
                    <button @click="resetTimer" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl border border-darkBorder transition">Reset</button>
                </div>
            </div>
        </div>

        <!-- SEZIONE 3: GESTIONE RICETTE -->
        <div x-show="activeTab === 'recipes'" class="space-y-4">
            <div class="bg-darkCard p-4 rounded-3xl border border-darkBorder shadow-xl space-y-3">
                <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider flex items-center space-x-2">
                    <i class="fa-solid fa-book-bookmark text-amber-500"></i>
                    <span>Ricette Salvate in Cantiere</span>
                </h2>

                <template x-if="savedRecipes.length === 0">
                    <p class="text-xs text-slate-500 text-center py-6">Nessuna ricetta salvata. Configura i dosaggi e clicca su "Salva nei Preferiti".</p>
                </template>

                <div class="space-y-2">
                    <template x-for="(recipe, index) in savedRecipes" :key="index">
                        <div class="bg-slate-900/90 p-3 rounded-2xl border border-darkBorder flex justify-between items-center">
                            <div>
                                <h3 class="text-xs font-bold text-amber-400" x-text="recipe.name"></h3>
                                <p class="text-[10px] text-slate-400" x-text="'A: ' + recipe.a + 'g | B: ' + recipe.b + 'g' + (recipe.c ? ' | Carica: ' + recipe.c + 'g' : '')"></p>
                            </div>
                            <div class="flex space-x-1">
                                <button @click="loadRecipe(recipe)" class="bg-amber-500/20 text-amber-400 p-2 rounded-xl text-xs" title="Carica ricetta"><i class="fa-solid fa-arrow-down"></i></button>
                                <button @click="deleteRecipe(index)" class="bg-rose-500/20 text-rose-400 p-2 rounded-xl text-xs" title="Elimina"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

    </main>

    <!-- LOGICA ALPINE.JS -->
    <script>
        function resinApp() {
            return {
                activeTab: 'calculator',
                calcMode: 'weight',
                inputMode: 'surface',
                sqm: 10,
                consumption: 0.5,
                compA: 100,
                ratioB: 30,
                
                useCompC: false,
                nameCompC: 'Quarzo 0.3',
                valCompC: 50, // percentuale o grammi

                useDilution: false,
                nameDilution: 'Acqua / Diluente',
                percentDilution: 10,

                // Timer state
                timerMinutesSetting: 30,
                timeLeft: 30 * 60,
                timerRunning: false,
                timerInterval: null,

                savedRecipes: JSON.parse(localStorage.getItem('mixmaster_recipes') || '[]'),
                wakeLockActive: false,
                wakeLockObj: null,

                get totalNeededKg() {
                    return this.sqm * this.consumption;
                },

                get resultA() {
                    if (this.inputMode === 'surface') {
                        let totalKg = this.totalNeededKg * 1000;
                        let ratioSum = 100 + Number(this.ratioB);
                        return (totalKg * 100) / ratioSum;
                    } else {
                        return Number(this.compA);
                    }
                },

                get resultB() {
                    return (this.resultA * Number(this.ratioB)) / 100;
                },

                get resultC() {
                    if (!this.useCompC) return 0;
                    return (this.resultA + this.resultB) * (Number(this.valCompC) / 100);
                },

                get resultDilution() {
                    if (!this.useDilution) return 0;
                    return (this.resultA + this.resultB) * (Number(this.percentDilution) / 100);
                },

                get totalBatchWeight() {
                    return this.resultA + this.resultB + this.resultC + this.resultDilution;
                },

                get timerStateText() {
                    let pct = this.timeLeft / (this.timerMinutesSetting * 60);
                    if (pct > 0.4) return 'Lavorabile';
                    if (pct > 0.15) return 'Attenzione';
                    return 'In Scadenza!';
                },

                get timerStatusColor() {
                    let pct = this.timeLeft / (this.timerMinutesSetting * 60);
                    if (pct > 0.4) return 'border-emerald-500 text-emerald-400 bg-emerald-500/10';
                    if (pct > 0.15) return 'border-amber-500 text-amber-400 bg-amber-500/10';
                    return 'border-rose-500 text-rose-500 bg-rose-500/10 animate-pulse';
                },

                formatTime(seconds) {
                    let m = Math.floor(seconds / 60);
                    let s = seconds % 60;
                    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                },

                startTimer() {
                    if (this.timerRunning) return;
                    this.timerRunning = true;
                    this.timerInterval = setInterval(() => {
                        if (this.timeLeft > 0) {
                            this.timeLeft--;
                        } else {
                            this.pauseTimer();
                            alert('⚠️ POT LIFE SCADUTO! Attenzione alla presa del materiale in secchio.');
                        }
                    }, 1000);
                },

                pauseTimer() {
                    this.timerRunning = false;
                    clearInterval(this.timerInterval);
                },

                resetTimer() {
                    this.pauseTimer();
                    this.timeLeft = this.timerMinutesSetting * 60;
                },

                saveCurrentRecipe() {
                    let name = prompt("Nome della ricetta / formulato:", "Primer Epossidico");
                    if (!name) return;
                    let recipe = {
                        name: name,
                        a: this.resultA.toFixed(1),
                        b: this.resultB.toFixed(1),
                        c: this.useCompC ? this.resultC.toFixed(1) : null
                    };
                    this.savedRecipes.push(recipe);
                    localStorage.setItem('mixmaster_recipes', JSON.stringify(this.savedRecipes));
                    alert('Ricetta salvata con successo!');
                },

                loadRecipe(recipe) {
                    this.compA = Number(recipe.a);
                    this.activeTab = 'calculator';
                },

                deleteRecipe(index) {
                    this.savedRecipes.splice(index, 1);
                    localStorage.setItem('mixmaster_recipes', JSON.stringify(this.savedRecipes));
                },

                async toggleWakeLock() {
                    try {
                        if ('wakeLock' in navigator) {
                            if (!this.wakeLockActive) {
                                this.wakeLockObj = await navigator.wakeLock.request('screen');
                                this.wakeLockActive = true;
                            } else {
                                await this.wakeLockObj.release();
                                this.wakeLockObj = null;
                                this.wakeLockActive = false;
                            }
                        } else {
                            alert('Il tuo browser non supporta il blocco schermo attivo.');
                        }
                    } catch (err) {
                        console.error(err);
                    }
                }
            }
        }
    </script>

    <!-- SERVICE WORKER REGISTRATION -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrato con successo:', reg.scope))
                    .catch(err => console.log('Registrazione Service Worker fallita:', err));
            });
        }
    </script>
</body>
</html>
